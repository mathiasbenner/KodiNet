name: Build & Publish Docker Images

on:
  push:
    tags:
      - 'v*'          # triggered on each tag vX.Y.Z

env:
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/kodinet-web
  STORAGE_IMAGE: ghcr.io/${{ github.repository_owner }}/kodinet-storage
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # necessary to push on ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token

      - name: Extract version tag
        id: meta
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── Web Image (Blazor) ──────────────────────────────────────────────────
      - name: Build & push kodinet-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: KodiNet.Web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.WEB_IMAGE }}:latest

      # ── Storage Image (FastAPI Python) ──────────────────────────────────────
      - name: Build & push kodinet-storage
        uses: docker/build-push-action@v7
        with:
          context: ./KodiNet.API
          push: true
          tags: |
            ${{ env.STORAGE_IMAGE }}:${{ steps.meta.outputs.VERSION }}
            ${{ env.STORAGE_IMAGE }}:latest
