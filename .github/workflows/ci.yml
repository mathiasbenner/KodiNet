name: CI — Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KodiNet.sln

      - name: Build
        run: dotnet build KodiNet.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test KodiNet.sln --no-build --configuration Release \
               --logger "trx;LogFileName=results.trx" \
               --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()   # afficher même si les tests échouent
        with:
          name: Test Results
          path: '**/results.trx'
          reporter: dotnet-trx

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: '**/coverage.cobertura.xml'